<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <img class="hero" src="assets/hero.gif" alt="Pixel-art subway car with a guy in an orange beanie saying hey">

    <section class="dialog">
      <h1 data-content="title"></h1>
      <p class="tagline" data-content="tagline"></p>
      <p data-content="intro"></p>

  </main>

  <footer>

      <svg viewBox="0 0 16 16" aria-hidden="true">

        <path class="waves" d="M10 6h1v4h-1zM12 4h1v8h-1zM14 2h1v12h-1z"/>
        <path class="muted" d="M10 5h1v1h-1zM11 6h1v1h-1zM12 7h1v2h-1zM13 9h1v1h-1zM14 10h1v1h-1zM14 5h1v1h-1zM13 6h1v1h-1zM11 9h1v1h-1zM10 10h1v1h-1z"/>
      </svg>
    </button>
  </footer>

  <script src="content.js"></script>
  <script src="nav.js"></script>
</body>
</html>
